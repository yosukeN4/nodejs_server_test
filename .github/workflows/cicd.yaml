name: cicd for nest project.
on: push
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 24

        - name: Build app to unittest
          run: npm run build:dev

        - name: Unittest
          run: npx mocha